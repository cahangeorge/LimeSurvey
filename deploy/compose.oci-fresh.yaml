# Fresh installation only. Run fresh.py before creating any resources.
name: ${OCI_PROJECT:?new ls-oci project required}
services:
  db:
    image: ${OCI_DB_IMAGE:?admitted immutable digest required}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${OCI_DB_NAME:?required}
      MARIADB_USER: ${OCI_DB_USER:?required}
      MARIADB_PASSWORD: ${OCI_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${OCI_DB_ROOT_PASSWORD:?required}
    volumes: [db-data:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: '1.0'
    mem_limit: 1g
  app:
    image: ${OCI_APP_IMAGE:?admitted immutable digest required}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${OCI_DB_NAME:?required}
      DB_USER: ${OCI_DB_USER:?required}
      DB_PASSWORD: ${OCI_DB_PASSWORD:?required}
      RESEND_API_KEY: ${OCI_RESEND_API_KEY:?required}
      RESEND_FROM_EMAIL: ${OCI_RESEND_FROM_EMAIL:?required}
      RESEND_FROM_NAME: ${OCI_RESEND_FROM_NAME:-}
    volumes:
      - app-code:/var/www/html
      - app-config:/var/www/html/application/config
      - app-upload:/var/www/html/upload
      - app-plugins:/var/www/html/plugins
      - app-themes:/var/www/html/themes
      - app-runtime:/var/www/html/tmp
    networks: [database, application, egress]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && php-fpm -t']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cpus: '1.0'
    mem_limit: 512m
  nginx:
    image: ${OCI_NGINX_IMAGE:?admitted immutable digest required}
    platform: linux/arm64
    restart: unless-stopped
    read_only: true
    labels:
      traefik.enable: 'false'
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro
      - app-upload:/var/www/html/upload:ro
      - app-plugins:/var/www/html/plugins:ro
      - app-themes:/var/www/html/themes:ro
      - app-runtime:/var/www/html/tmp:ro
    tmpfs: [/var/cache/nginx, /var/run]
    ports: ['127.0.0.1:${OCI_PROBE_PORT:?required}:80']
    networks: [application, proxy]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cpus: '0.25'
    mem_limit: 128m
volumes:
  db-data: {name: '${OCI_PROJECT}-fresh-db'}
  app-code: {name: '${OCI_PROJECT}-fresh-code'}
  app-config: {name: '${OCI_PROJECT}-fresh-config'}
  app-upload: {name: '${OCI_PROJECT}-fresh-upload'}
  app-plugins: {name: '${OCI_PROJECT}-fresh-plugins'}
  app-themes: {name: '${OCI_PROJECT}-fresh-themes'}
  app-runtime: {name: '${OCI_PROJECT}-fresh-runtime'}
networks:
  database: {name: '${OCI_PROJECT}-database', internal: true}
  application: {name: '${OCI_PROJECT}-application', internal: true}
  egress: {name: '${OCI_PROJECT}-egress'}
  proxy: {external: true, name: '${OCI_PROXY_NETWORK:?existing proxy network required}'}
