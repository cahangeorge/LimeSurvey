services:
  db:
    image: mariadb:11.4.8-noble@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME}
      MARIADB_USER: ${DB_USER:?Set DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${APP_IMAGE:-limesurvey-app:7.1.1-260914}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - app-code-v7-1-1:/var/www/html
      - app-config:/var/www/html/application/config
      - app-upload:/var/www/html/upload
      - app-plugins:/var/www/html/plugins
      - app-themes:/var/www/html/themes
      - app-runtime:/var/www/html/tmp
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    read_only: true
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code-v7-1-1:/var/www/html:ro
      - app-upload:/var/www/html/upload:ro
      - app-plugins:/var/www/html/plugins:ro
      - app-themes:/var/www/html/themes:ro
      - app-runtime:/var/www/html/tmp:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    expose:
      - "80"
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  db-data:
  app-code-v7-1-1:
  app-config:
  app-upload:
  app-plugins:
  app-themes:
  app-runtime:

networks:
  frontend:
  backend:
    internal: true
  egress:
