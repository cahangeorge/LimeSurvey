name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-release-gate:
    name: ARM64 build and runtime checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Check out the tested revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64

      - name: Validate Compose and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          sh -n docker/entrypoint.sh
          sh -n tests/smoke.sh

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/app" \
            -w /app \
            composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
            composer install --no-interaction --no-progress --prefer-dist

      - name: Run no-network Resend tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "${PWD}:/app" \
            -w /app \
            composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
            sh -c 'find docker plugins tests -name "*.php" -print0 | xargs -0 -n1 php -l && vendor/bin/phpunit tests/ResendEmailPluginTest.php'

      - name: Build the pinned LimeSurvey image natively
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --file docker/php/Dockerfile \
            --tag limesurvey-app:arm64-release \
            .

      - name: Verify PHP modules in the ARM64 image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php limesurvey-app:arm64-release -r '
            $required = [
              "bcmath", "curl", "exif", "gd", "gettext", "imap", "intl",
              "ldap", "mbstring", "mysqli", "pdo_mysql", "soap", "zip",
              "Zend OPcache"
            ];
            foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                fwrite(STDERR, "Missing PHP extension: {$extension}\n");
                exit(1);
              }
            }
          '

      - name: Run the ARM64 Compose smoke test
        shell: bash
        env:
          APP_IMAGE: limesurvey-app:arm64-release
          COMPOSE_PROJECT_NAME: limesurvey-arm64-release-gate
        run: |
          set -euo pipefail
          ./tests/smoke.sh

      - name: Reject credential-like tracked content
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'BEGIN (OPENSSH|RSA|EC) PRIVATE '"KEY"
            'Bearer ''[A-Za-z0-9._-]{20,}'
            'gh''[opusr]_[A-Za-z0-9]{20,}'
            'RESEND_API_''KEY=.{8}'
            'POSTGRES_''PASSWORD=.{8}'
            'DB_''PASSWORD=.{8}'
            'DB_ROOT_''PASSWORD=.{8}'
          )
          allowed=(
            '.env.example:DB_''PASSWORD=example-only-not-a-secret'
            '.env.example:DB_ROOT_''PASSWORD=example-root-only-not-a-secret'
            '.env.example:RESEND_API_''KEY=example'
          )
          for pattern in "${patterns[@]}"; do
            matches=$(git grep -E "$pattern" -- . || true)
            for example in "${allowed[@]}"; do
              matches=$(printf '%s\n' "$matches" | grep -Fvx "$example" || true)
            done
            if [ -n "$matches" ]; then
              echo 'Credential-like tracked content found.' >&2
              exit 1
            fi
          done

      - name: Verify clean tracked state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no)"
