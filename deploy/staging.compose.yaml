# One selected-triple adapter. Set validated values from operate.py prepare.
name: ${DELIVERY_PROJECT:?validated project required}
services:
  db:
    image: ${DELIVERY_DB_IMAGE:?admitted digest required}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${STAGING_DB_NAME:?required}
      MARIADB_USER: ${STAGING_DB_USER:?required}
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?required}
    volumes: [db-data:/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: '1.0'
    mem_limit: 1g
  app:
    image: ${DELIVERY_APP_IMAGE:?admitted digest required}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${STAGING_DB_NAME:?required}
      DB_USER: ${STAGING_DB_USER:?required}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?required}
      RESEND_API_KEY: ''
      RESEND_FROM_EMAIL: probe@example.invalid
      RESEND_FROM_NAME: Synthetic staging
    volumes:
      - app-code:/var/www/html
      - app-config:/var/www/html/application/config
      - app-upload:/var/www/html/upload
      - app-plugins:/var/www/html/plugins
      - app-themes:/var/www/html/themes
      - app-runtime:/var/www/html/tmp
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && php-fpm -t']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cpus: '1.0'
    mem_limit: 512m
  nginx:
    image: ${DELIVERY_NGINX_IMAGE:?admitted digest required}
    platform: linux/arm64
    restart: unless-stopped
    read_only: true
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - app-code:/var/www/html:ro
      - app-upload:/var/www/html/upload:ro
      - app-plugins:/var/www/html/plugins:ro
      - app-themes:/var/www/html/themes:ro
      - app-runtime:/var/www/html/tmp:ro
    tmpfs: [/var/cache/nginx, /var/run]
    ports: ['127.0.0.1:${DELIVERY_PORT:?required}:80']
    networks: [frontend, backend]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cpus: '0.25'
    mem_limit: 128m
volumes:
  db-data: {external: true, name: '${DELIVERY_DB_VOLUME}'}
  app-code: {external: true, name: '${DELIVERY_CODE_VOLUME}'}
  app-config: {external: true, name: '${DELIVERY_CONFIG_VOLUME}'}
  app-upload: {external: true, name: '${DELIVERY_UPLOAD_VOLUME}'}
  app-plugins: {external: true, name: '${DELIVERY_PLUGINS_VOLUME}'}
  app-themes: {external: true, name: '${DELIVERY_THEMES_VOLUME}'}
  app-runtime: {external: true, name: '${DELIVERY_RUNTIME_VOLUME}'}
networks:
  backend: {external: true, name: '${DELIVERY_BACKEND_NETWORK}'}
  frontend: {external: true, name: '${DELIVERY_FRONTEND_NETWORK}'}
