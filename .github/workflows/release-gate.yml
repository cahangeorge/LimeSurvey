name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast configuration and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the tested revision without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Validate Compose, shell scripts and dependency gate behavior
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          sh -n docker/entrypoint.sh
          sh -n tests/smoke.sh
          sh -n tests/nginx-security-smoke.sh
          sh -n scripts/ci/install-security-tools.sh
          python3 -m unittest discover -s tests -p 'test_*gate.py'

      - name: Install locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/app" -w /app \
            composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
            sh -c 'composer validate --strict --no-check-publish && composer install --no-interaction --no-progress --prefer-dist'

      - name: Run PHP lint and no-network Resend tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "${PWD}:/app" -w /app \
            composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
            sh -c 'find docker plugins tests -name "*.php" -print0 | xargs -0 -n1 php -l && vendor/bin/phpunit tests/ResendEmailPluginTest.php'

      - name: Verify clean tracked state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

  security:
    name: Secrets, workflows and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out complete tested history without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install verified security tools
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/install-security-tools.sh "${RUNNER_TEMP}/security-tools"

      - name: Scan Git history and current files without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/security-tools/gitleaks" git --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --log-level error --exit-code 1 .
          "${RUNNER_TEMP}/security-tools/gitleaks" dir --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --log-level error --exit-code 1 .

      - name: Validate and audit every workflow
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/security-tools/actionlint" .github/workflows/*.yml
          "${RUNNER_TEMP}/security-tools/zizmor" --offline --strict-collection .github/workflows/*.yml

      - name: Scan all locked dependencies and require complete coverage
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/security-tools/trivy" fs \
            --cache-dir "${RUNNER_TEMP}/trivy-cache" --timeout 5m --no-progress \
            --disable-telemetry --offline-scan --skip-version-check \
            --scanners vuln --include-dev-deps --list-all-pkgs --ignorefile '' \
            --format json --output "${RUNNER_TEMP}/trivy-dependencies.json" composer.lock
          python3 scripts/ci/check-dependencies.py \
            "${RUNNER_TEMP}/trivy-dependencies.json" composer.lock \
            "${RUNNER_TEMP}/trivy-cache/db/metadata.json"

  arm64-release-gate:
    name: ARM64 build and runtime checks
    needs: [quality, security]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Check out the tested revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64

      - name: Build the pinned LimeSurvey image natively
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --file docker/php/Dockerfile \
            --tag limesurvey-app:arm64-release \
            .

      - name: Verify PHP modules in the ARM64 image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php limesurvey-app:arm64-release -r '
            $required = [
              "bcmath", "curl", "exif", "gd", "gettext", "imap", "intl",
              "ldap", "mbstring", "mysqli", "pdo_mysql", "soap", "zip",
              "Zend OPcache"
            ];
            foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                fwrite(STDERR, "Missing PHP extension: {$extension}\n");
                exit(1);
              }
            }
          '

      - name: Run the ARM64 Compose smoke test
        shell: bash
        env:
          APP_IMAGE: limesurvey-app:arm64-release
          COMPOSE_PROJECT_NAME: limesurvey-arm64-release-gate
        run: |
          set -euo pipefail
          ./tests/smoke.sh

      - name: Build and scan the corrected Nginx companion natively
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nginx-evidence"
          mkdir -p "$evidence" "$RUNNER_TEMP/nginx-tools"
          docker build --pull --file docker/nginx/Dockerfile \
            --tag limesurvey-nginx:arm64-canary docker/nginx
          image_id=$(docker image inspect limesurvey-nginx:arm64-canary --format '{{.Id}}')
          printf '%s\n' "$image_id" > "$evidence/image-id.txt"
          docker image inspect "$image_id" > "$evidence/image.json"
          docker run --rm --read-only --network none --entrypoint cat \
            "$image_id" /lib/apk/db/installed > "$evidence/installed-apk.txt"
          docker save "$image_id" > "$RUNNER_TEMP/nginx-image.tar"
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/nginx-tools/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-ARM64.tar.gz
          printf '%s  %s\n' a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3 \
            "$RUNNER_TEMP/nginx-tools/trivy.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/nginx-tools/trivy.tar.gz" \
            --directory "$RUNNER_TEMP/nginx-tools" --no-same-owner --no-same-permissions trivy
          "$RUNNER_TEMP/nginx-tools/trivy" image --input "$RUNNER_TEMP/nginx-image.tar" \
            --cache-dir "$RUNNER_TEMP/nginx-cache" --timeout 8m --no-progress \
            --disable-telemetry --offline-scan --skip-version-check --config '' \
            --scanners vuln --list-all-pkgs --ignorefile '' \
            --format json --output "$evidence/scan.json"
          cp "$RUNNER_TEMP/nginx-cache/db/metadata.json" "$evidence/db.json"
          python3 -I - "$evidence" "$image_id" <<'PY'
          import datetime,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); image_id=sys.argv[2]
          inspect=json.loads((p/'image.json').read_text())
          assert len(inspect)==1 and inspect[0]['Id']==image_id
          assert inspect[0]['Architecture']=='arm64' and inspect[0]['Os']=='linux'
          scan=json.loads((p/'scan.json').read_text()); metadata=scan['Metadata']
          assert metadata['ImageID']==image_id and metadata['ImageConfig']['architecture']=='arm64'
          assert metadata['OS']['Family']=='alpine' and metadata['OS']['Name']=='3.24.2'
          assert not metadata['OS'].get('EOSL',False)
          installed={}
          for record in (p/'installed-apk.txt').read_text().strip().split('\n\n'):
              names=[s[2:] for s in record.splitlines() if s.startswith('P:')]
              versions=[s[2:] for s in record.splitlines() if s.startswith('V:')]
              assert len(names)==len(versions)==1 and names[0] and versions[0]
              assert names[0] not in installed
              installed[names[0]]=versions[0]
          results=scan['Results']
          assert len(results)==1 and results[0]['Class']=='os-pkgs' and results[0]['Type']=='alpine'
          reported={}
          for package in results[0]['Packages']:
              assert package['Name'] not in reported
              reported[package['Name']]=package['Version']
          assert installed and reported==installed
          for name,version in {'libexpat':'2.8.5-r0','libpng':'1.6.59-r0','pcre2':'10.49-r0','tiff':'4.7.2-r0'}.items():
              assert installed[name]==version
          db=json.loads((p/'db.json').read_text()); now=datetime.datetime.now(datetime.timezone.utc)
          assert db['Version']==2
          for field,hours in [('UpdatedAt',48),('DownloadedAt',24)]:
              stamp=datetime.datetime.fromisoformat(db[field].replace('Z','+00:00'))
              assert stamp.tzinfo is not None
              assert -300 <= (now-stamp).total_seconds() <= hours*3600
          findings=results[0].get('Vulnerabilities',[])
          assert all(v['Severity'] in {'LOW','MEDIUM','HIGH','CRITICAL','UNKNOWN'} for v in findings)
          assert not [v for v in findings if v['Severity'] in {'HIGH','CRITICAL','UNKNOWN'}]
          (p/'acceptance.json').write_text(json.dumps({'image_id':image_id,'platform':'linux/arm64','apk_count':len(installed),'gate':'PASS_NATIVE_SCAN'},indent=2)+'\n')
          PY

      - name: Verify corrected Nginx HTTP and FastCGI behavior on ARM64
        shell: bash
        run: |
          set -euo pipefail
          NGINX_IMAGE=$(docker image inspect limesurvey-nginx:arm64-canary --format '{{.Id}}')
          FPM_IMAGE=$(docker image inspect limesurvey-app:arm64-release --format '{{.Id}}')
          export NGINX_IMAGE FPM_IMAGE
          ./tests/nginx-security-smoke.sh | tee "$RUNNER_TEMP/nginx-evidence/smoke.log"

      - name: Preserve bounded Nginx canary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nginx-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nginx-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify clean tracked state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

  mvp-gate:
    name: MVP required gate
    needs: [quality, security, arm64-release-gate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ARM64_RESULT: ${{ needs.arm64-release-gate.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$ARM64_RESULT" = success
